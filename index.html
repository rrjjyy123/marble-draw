<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>구슬 뽑기 - 교실용 추첨기</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="apple-touch-icon" sizes="57x57" href="assets/apple-icon-57x57.png">
  <link rel="apple-touch-icon" sizes="60x60" href="assets/apple-icon-60x60.png">
  <link rel="apple-touch-icon" sizes="72x72" href="assets/apple-icon-72x72.png">
  <link rel="apple-touch-icon" sizes="76x76" href="assets/apple-icon-76x76.png">
  <link rel="apple-touch-icon" sizes="114x114" href="assets/apple-icon-114x114.png">
  <link rel="apple-touch-icon" sizes="120x120" href="assets/apple-icon-120x120.png">
  <link rel="apple-touch-icon" sizes="144x144" href="assets/apple-icon-144x144.png">
  <link rel="apple-touch-icon" sizes="152x152" href="assets/apple-icon-152x152.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-icon-180x180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/android-icon-192x192.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="96x96" href="assets/favicon-96x96.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
  <link rel="manifest" href="assets/manifest.json">

  <meta name="msapplication-TileColor" content="#ffffff">
  <meta name="msapplication-TileImage" content="assets/ms-icon-144x144.png">
  <meta name="theme-color" content="#ffffff">

  <meta name="description" content="구슬을 굴려 당첨자를 뽑는 교실용 추첨기. 광고 없이, 맵도 직접 만들 수 있습니다.">
  <meta property="og:url" content="https://rrjjyy123.github.io/marble-draw/">
  <meta property="og:title" content="구슬 뽑기">
  <meta property="og:description" content="광고 없는 교실용 구슬 추첨기">
  <meta property="og:site_name" content="rrjjyy123.github.io">
  <meta property="og:type" content="website">

  <link rel='stylesheet' href='assets/style.scss' />
</head>
<body>
<script type="module" src="./src/index.ts"></script>
<script type="text/javascript">
  function getNames() {
    const value = document.querySelector('#in_names').value.trim();
    return value.split(/[,\r\n]/g).map(v => v.trim()).filter(v => !!v);
  }

  function parseName(nameStr) {
    const weightRegex = /(\/\d+)/;
    const countRegex = /(\*\d+)/;
    const hasWeight = weightRegex.test(nameStr);
    const hasCount = countRegex.test(nameStr);
    const name = /^\s*([^\/*]+)?/.exec(nameStr)[1];
    const weight = hasWeight ? parseInt(weightRegex.exec(nameStr)[1].replace('/', '')) : 1;
    const count = hasCount ? parseInt(countRegex.exec(nameStr)[1].replace('*', '')) : 1;
    return {
      name,
      weight,
      count,
    };
  }

  function getReady() {
    const names = getNames();
    try {
      localStorage.setItem('mbr_names', names.join(','));
    } catch (e) {
      // 저장이 막혀 있어도 추첨은 되어야 한다
    }
    // 다른 페이지 안에 띄워져 있으면 그 페이지에도 이름을 알린다.
    // iframe 안에서는 브라우저가 저장소를 막거나 따로 떼어 두는 일이 많아, 띄운 쪽이 대신 기억했다가 ?names= 로 다시 넘겨 준다
    if (window.parent !== window) {
      window.parent.postMessage({ type: 'marble-draw:names', names: names.join(',') }, '*');
    }
    // 순차 추첨이면 이미 뽑힌 사람을 뺀다. 입력창 원문은 건드리지 않는다
    const playing = window.classroom ? window.classroom.filterNames(names) : names;
    window.roulette.setMarbles(playing);
    ready = playing.length > 0;
    applyWinnerSetting();
    if (window.classroom) window.classroom.onNamesChanged();
  }

  // 구슬 수가 바뀔 때마다 다시 호출된다. 범위 클리핑은 roulette이 하고, 잘린 결과를 input에 되돌려 쓴다.
  // edited는 사용자가 방금 고친 범위 input('start' | 'end')
  function applyWinnerSetting(edited) {
    const rankInput = document.querySelector('#in_winningRank');
    const startInput = document.querySelector('#in_rangeStart');
    const endInput = document.querySelector('#in_rangeEnd');

    let start;
    let end;
    switch (winnerType) {
      case 'first':
        start = end = 1;
        break;
      case 'last':
        start = end = window.roulette.getCount();
        break;
      case 'multi':
        start = parseInt(startInput.value, 10) || 1;
        end = parseInt(endInput.value, 10) || 1;
        // 뒤집힌 범위는 방금 고친 쪽을 존중하고 반대쪽을 따라오게 한다
        if (end < start) {
          if (edited === 'end') {
            start = end;
          } else {
            end = start;
          }
        }
        break;
      default:
        start = end = parseInt(rankInput.value, 10) || 1;
    }

    window.roulette.setWinnerRange(start - 1, end - 1);
    const clipped = window.roulette.getWinnerRange();
    // 범위 input은 여러명 모드일 때만 건드린다. 다른 모드가 덮어쓰면 사용자가 넣어둔 범위가 날아간다
    if (winnerType === 'multi') {
      startInput.value = clipped.start + 1;
      endInput.value = clipped.end + 1;
    } else {
      rankInput.value = clipped.start + 1;
    }

    document.querySelector('.btn-first-winner').classList.toggle('active', winnerType === 'first');
    document.querySelector('.btn-last-winner').classList.toggle('active', winnerType === 'last');
    document.querySelector('.btn-multi-winner').classList.toggle('active', winnerType === 'multi');
    rankInput.classList.toggle('active', winnerType === 'custom');
    document.querySelector('.row-range').classList.toggle('active', winnerType === 'multi');
  }

  function selectWinnerType(type, edited) {
    winnerType = type;
    applyWinnerSetting(edited);
  }


  let ready = false;
  let winnerType = 'first';

  document.addEventListener('DOMContentLoaded', () => {
    initialize();
  });

  function initialize() {
    if (!window.roulette || !window.roulette.isReady) {
      console.log('does not loaded yet');
      setTimeout(initialize, 100);
      return;
    }
    console.log('initializing start');

    const urlParams = new URLSearchParams(window.location.search);
    const namesFromUrl = urlParams.get('names');

    if (namesFromUrl) {
      document.querySelector('#in_names').value = namesFromUrl.replace(/,/g, '\n');
    } else {
      // iframe 안처럼 저장소가 막혀 있으면 읽다가 오류가 나므로, 그때는 빈 칸으로 시작한다
      let savedNames = null;
      try {
        savedNames = localStorage.getItem('mbr_names');
      } catch (e) {
        savedNames = null;
      }
      if (savedNames) {
        document.querySelector('#in_names').value = savedNames;
      }
    }
    document.querySelector('#in_names').addEventListener('input', () => {
      getReady();
    });

    document.querySelector('#in_names').addEventListener('blur', () => {
      const nameSource = getNames();
      const nameSet = new Set();
      const nameCounts = {};
      nameSource.forEach(nameSrc => {
        const name = parseName(nameSrc);
        const key = name.weight > 1 ? `${name.name}/${name.weight}` : name.name;
        if (!nameSet.has(key)) {
          nameSet.add(key);
          nameCounts[key] = 0;
        }
        nameCounts[key] += name.count;
      });
      const result = [];
      Object.keys(nameCounts).forEach(key => {
        if (nameCounts[key] > 1) {
          result.push(`${key}*${nameCounts[key]}`);
        } else {
          result.push(key);
        }
      });

      const oldValue = document.querySelector('#in_names').value;
      const newValue = result.join(',');

      if (oldValue !== newValue) {
        document.querySelector('#in_names').value = newValue;
        getReady();
      }
    });

    document.querySelector('#btnShuffle').addEventListener('click', () => {
      getReady();
    });

    document.querySelector('#btnStart').addEventListener('click', () => {
      if (!ready) {
        // 한 판이 끝난 뒤라면 다시 섞어서 바로 시작한다. 순차 추첨이면 방금 뽑힌 사람이 빠진다
        getReady();
        if (!ready) {
          if (getNames().length > 0) simpleToast('모두 뽑혔습니다. "뽑힌 사람 초기화"를 눌러주세요');
          return;
        }
      }
      document.querySelector('#settings').classList.add('hide');
      window.roulette.start();
    });

    document.querySelector('#chkAutoRecording').addEventListener('change', (e) => {
      window.options.autoRecording = e.target.matches(':checked');
      window.roulette.setAutoRecording(window.options.autoRecording);
    });

    document.querySelector('#chkSkill').addEventListener('change', (e) => {
      window.options.useSkills = e.target.matches(':checked');
    });

    document.querySelector('#chkDarkMode').addEventListener('change', (e) => {
      window.options.darkMode = e.target.matches(':checked');
      window.roulette.setTheme(window.options.darkMode ? 'dark' : 'light');
      document.documentElement.classList.toggle('light', !window.options.darkMode);
    });

    document.querySelector('#in_winningRank').addEventListener('change', () => selectWinnerType('custom'));
    document.querySelector('.btn-last-winner').addEventListener('click', () => selectWinnerType('last'));
    document.querySelector('.btn-first-winner').addEventListener('click', () => selectWinnerType('first'));
    document.querySelector('.btn-multi-winner').addEventListener('click', () => selectWinnerType('multi'));
    document.querySelector('#in_rangeStart').addEventListener('change', () => selectWinnerType('multi', 'start'));
    document.querySelector('#in_rangeEnd').addEventListener('change', () => selectWinnerType('multi', 'end'));

    window.roulette.addEventListener('goal', (e) => {
      ready = false;
      if (window.classroom && !window.roulette.isTestingDraft) {
        window.classroom.recordResult(e.detail.winners);
      }
      // 편집기 테스트 중에는 설정 패널 대신 '편집으로 돌아가기' 막대가 떠 있다
      if (window.roulette.isTestingDraft) return;
      setTimeout(() => {
        document.querySelector('#settings').classList.remove('hide');
      }, 3000);
    });

    window.roulette.addEventListener('message', (e) => {
      simpleToast(e.detail);
    });

    const toggleBtn = document.querySelector('#btnToggleSettings');
    const collapsible = document.querySelector('.collapsible-rows');
    toggleBtn.addEventListener('click', () => {
      collapsible.classList.toggle('collapsed');
      toggleBtn.querySelector('.toggle-arrow').textContent =
        collapsible.classList.contains('collapsed') ? '▲' : '▼';
    });

    document.querySelector('#btnShuffle').click();

    // 맵 선택과 편집기는 src/editor/editorPanel.ts, 명단 관리는 src/classroom 이 맡는다
    window.initEditorPanel();
    window.initClassroom();
    getReady();

    function simpleToast(msg) {
      const toast = document.createElement('div');
      toast.classList.add('toast');
      toast.innerHTML = msg;

      if (window.translateElement) {
        console.log('try to translate');
        window.translateElement(toast);
      }

      document.body.appendChild(toast);
      setTimeout(() => {
        document.body.removeChild(toast);
      }, 1200);
    }
  }
</script>
<h1 class="sr-only">구슬 뽑기 - 교실용 랜덤 추첨기</h1>
<div id="settings" class="settings">
  <div class="right">
    <button id="btnToggleSettings" class="btn-toggle-settings">
      <span data-trans>Settings</span>
      <i class="toggle-arrow">▲</i>
    </button>
    <div class="collapsible-rows collapsed">
      <div class="row">
        <label for='sltRoster'>
          <i class="icon trophy"></i>
          <span>명단</span>
        </label>
        <select id="sltRoster"></select>
        <button id="btnSaveRoster" class="btn-map-tool" title="지금 입력한 이름들을 명단으로 저장합니다">저장</button>
        <button id="btnDeleteRoster" class="btn-map-tool">삭제</button>
      </div>
      <div class="row">
        <label for="chkSequential" title="한 번 뽑힌 사람은 다음 추첨에서 빠집니다">
          <i class="icon shuffle"></i>
          <span>순차 추첨</span>
        </label>
        <input type="checkbox" id="chkSequential" />
        <span id="drawnStatus" class="drawn-status"></span>
      </div>
      <div class="row row-map-tools">
        <label></label>
        <div class="btn-group">
          <button id="btnResetDrawn" class="btn-map-tool">뽑힌 사람 초기화</button>
          <button id="btnHistory" class="btn-map-tool">추첨 기록</button>
        </div>
      </div>
      <div class="row">
        <label for='sltMap'>
          <i class="icon map"></i>
          <span data-trans>Map</span>
        </label>
        <select id="sltMap"></select>
        <button id="btnEditMap" class="btn-map-tool" title="이 맵을 편집합니다">편집</button>
      </div>
      <div class="row row-map-tools">
        <label></label>
        <div class="btn-group">
          <button id="btnNewMap" class="btn-map-tool">새 맵</button>
          <button id="btnDuplicateMap" class="btn-map-tool">복제</button>
          <button id="btnDeleteMap" class="btn-map-tool">삭제</button>
          <button id="btnImportMaps" class="btn-map-tool">가져오기</button>
          <button id="btnExportMaps" class="btn-map-tool">내보내기</button>
        </div>
      </div>
      <div class="row row-toggles">
        <div class='toggle-item'>
          <label for='chkAutoRecording'>
            <i class="icon record"></i>
            <span data-trans>Recording</span>
          </label>
          <input type="checkbox" id="chkAutoRecording" />
        </div>
        <div class='toggle-item'>
          <label for='chkSkill'>
            <i class="icon bomb"></i>
            <span data-trans>Using skills</span>
          </label>
          <input type="checkbox" id="chkSkill" checked />
        </div>
      </div>
      <div class="row">
        <label>
          <i class="icon trophy"></i>
          <span data-trans>The winner is</span>
        </label>
        <div class="btn-group">
          <button class="btn-winner btn-first-winner active" data-trans>First</button>
          <button class="btn-winner btn-last-winner" data-trans>Last</button>
          <input type="number" id="in_winningRank" value="1" min="1" />
          <button class="btn-winner btn-multi-winner" data-trans>Multiple</button>
        </div>
      </div>
      <div class="row row-range">
        <label></label>
        <div class="btn-group range-group">
          <input type="number" id="in_rangeStart" value="1" min="1" />
          <span class="range-sep">~</span>
          <input type="number" id="in_rangeEnd" value="3" min="1" />
        </div>
      </div>
      <div class="row row-theme">
        <div class='theme'>
          <i class='icon sun'></i>
          <input type='checkbox' id='chkDarkMode' checked />
          <i class='icon moon'></i>
        </div>
      </div>
    </div>
  </div>
  <div class="left">
    <h3 data-trans>Enter names below</h3>
    <textarea id="in_names" placeholder="Input names separated by commas or line feed here" data-trans="placeholder">수박*2,키위*2,귤*2</textarea>
    <div class="actions">
      <button id="btnShuffle">
        <i class="icon shuffle"></i>
        <span data-trans>Shuffle</span>
      </button>
      <button id="btnStart">
        <i class="icon play"></i>
        <span data-trans>Start</span>
      </button>
    </div>
  </div>
</div>
<input type="file" id="mapFileInput" accept="application/json,.json" hidden />

<dialog id="historyDialog" class="history-dialog">
  <h2>추첨 기록</h2>
  <div id="historyBody" class="history-body"></div>
  <div class="history-actions">
    <button id="btnHistoryCsv">CSV 로 저장</button>
    <button id="btnHistoryClear" class="danger">기록 모두 지우기</button>
    <button id="btnHistoryClose">닫기</button>
  </div>
</dialog>

<div id="editor" class="editor hidden">
  <div class="editor-bar">
    <div class="editor-tools" id="editorTools"></div>
    <div class="editor-bar-actions">
      <label class="editor-snap">
        <input type="checkbox" id="chkSnap" checked />
        <span>격자에 맞춤</span>
      </label>
      <button id="btnEditorUndo" title="실행 취소 (Ctrl+Z)">되돌리기</button>
      <button id="btnEditorRedo" title="다시 실행 (Ctrl+Y)">다시</button>
      <button id="btnEditorFit">전체 보기</button>
      <button id="btnEditorTest" class="primary">테스트</button>
      <button id="btnEditorSave" class="primary">저장</button>
      <button id="btnEditorClose">닫기</button>
    </div>
  </div>
  <div class="editor-panel">
    <div id="editorProps"></div>
  </div>
  <div class="editor-hint" id="editorHint"></div>
</div>

<div id="editorTestBar" class="editor-test-bar hidden">
  <span>편집 중인 맵을 테스트하고 있습니다</span>
  <button id="btnBackToEdit">편집으로 돌아가기</button>
</div>

<div class="copyright">구슬 뽑기 &mdash;
  <a href="https://github.com/lazygyu/roulette" target="_blank" rel="noopener">lazygyu의 Marble Roulette</a>(MIT) 기반 교실용 포크
</div>
</body>
</html>
