<h1 class=sr-only>구슬 뽑기 - 교실용 랜덤 추첨기</h1>
<div id=settings class=settings>
  <div class=right>
    <button id=btnToggleSettings class=btn-toggle-settings>
      <span data-trans>Settings</span>
      <i class=toggle-arrow>▲</i>
    </button>
    <div class="collapsed collapsible-rows">
      <div class=row>
        <label for=sltRoster>
          <i class="icon trophy"></i>
          <span>명단</span>
        </label>
        <select id=sltRoster></select>
        <button id=btnSaveRoster class=btn-map-tool title="지금 입력한 이름들을 명단으로 저장합니다">저장</button>
        <button id=btnDeleteRoster class=btn-map-tool>삭제</button>
      </div>
      <div class=row>
        <label for=chkSequential title="한 번 뽑힌 사람은 다음 추첨에서 빠집니다">
          <i class="icon shuffle"></i>
          <span>순차 추첨</span>
        </label>
        <input type=checkbox id=chkSequential>
        <span id=drawnStatus class=drawn-status></span>
      </div>
      <div class="row row-map-tools">
        <label></label>
        <div class=btn-group>
          <button id=btnResetDrawn class=btn-map-tool>뽑힌 사람 초기화</button>
          <button id=btnHistory class=btn-map-tool>추첨 기록</button>
        </div>
      </div>
      <div class=row>
        <label for=sltMap>
          <i class="icon map"></i>
          <span data-trans>Map</span>
        </label>
        <select id=sltMap></select>
        <button id=btnEditMap class=btn-map-tool title="이 맵을 편집합니다">편집</button>
      </div>
      <div class="row row-map-tools">
        <label></label>
        <div class=btn-group>
          <button id=btnNewMap class=btn-map-tool>새 맵</button>
          <button id=btnDuplicateMap class=btn-map-tool>복제</button>
          <button id=btnDeleteMap class=btn-map-tool>삭제</button>
          <button id=btnImportMaps class=btn-map-tool>가져오기</button>
          <button id=btnExportMaps class=btn-map-tool>내보내기</button>
        </div>
      </div>
      <div class="row row-toggles">
        <div class=toggle-item>
          <label for=chkAutoRecording>
            <i class="icon record"></i>
            <span data-trans>Recording</span>
          </label>
          <input type=checkbox id=chkAutoRecording>
        </div>
        <div class=toggle-item>
          <label for=chkSkill>
            <i class="bomb icon"></i>
            <span data-trans>Using skills</span>
          </label>
          <input type=checkbox id=chkSkill checked>
        </div>
      </div>
      <div class=row>
        <label>
          <i class="icon trophy"></i>
          <span data-trans>The winner is</span>
        </label>
        <div class=btn-group>
          <button class="active btn-first-winner btn-winner" data-trans>First</button>
          <button class="btn-last-winner btn-winner" data-trans>Last</button>
          <input type=number id=in_winningRank value=1 min=1>
          <button class="btn-multi-winner btn-winner" data-trans>Multiple</button>
        </div>
      </div>
      <div class="row row-range">
        <label></label>
        <div class="btn-group range-group">
          <input type=number id=in_rangeStart value=1 min=1>
          <span class=range-sep>~</span>
          <input type=number id=in_rangeEnd value=3 min=1>
        </div>
      </div>
      <div class="row row-theme">
        <div class=theme>
          <i class="icon sun"></i>
          <input type=checkbox id=chkDarkMode checked>
          <i class="icon moon"></i>
        </div>
      </div>
    </div>
  </div>
  <div class=left>
    <h3 data-trans>Enter names below</h3>
    <textarea id=in_names placeholder="Input names separated by commas or line feed here" data-trans=placeholder>수박*2,키위*2,귤*2</textarea>
    <div class=actions>
      <button id=btnShuffle>
        <i class="icon shuffle"></i>
        <span data-trans>Shuffle</span>
      </button>
      <button id=btnStart>
        <i class="icon play"></i>
        <span data-trans>Start</span>
      </button>
    </div>
  </div>
</div>
<input type=file id=mapFileInput accept=application/json,.json hidden>

<dialog id=historyDialog class=history-dialog>
  <h2>추첨 기록</h2>
  <div id=historyBody class=history-body></div>
  <div class=history-actions>
    <button id=btnHistoryCsv>CSV 로 저장</button>
    <button id=btnHistoryClear class=danger>기록 모두 지우기</button>
    <button id=btnHistoryClose>닫기</button>
  </div>
</dialog>

<div id=editor class="editor hidden">
  <div class=editor-bar>
    <div class=editor-tools id=editorTools></div>
    <div class=editor-bar-actions>
      <label class=editor-snap>
        <input type=checkbox id=chkSnap checked>
        <span>격자에 맞춤</span>
      </label>
      <button id=btnEditorUndo title="실행 취소 (Ctrl+Z)">되돌리기</button>
      <button id=btnEditorRedo title="다시 실행 (Ctrl+Y)">다시</button>
      <button id=btnEditorFit>전체 보기</button>
      <button id=btnEditorTest class=primary>테스트</button>
      <button id=btnEditorSave class=primary>저장</button>
      <button id=btnEditorClose>닫기</button>
    </div>
  </div>
  <div class=editor-panel>
    <div id=editorProps></div>
  </div>
  <div class=editor-hint id=editorHint></div>
</div>

<div id=editorTestBar class="editor-test-bar hidden">
  <span>편집 중인 맵을 테스트하고 있습니다</span>
  <button id=btnBackToEdit>편집으로 돌아가기</button>
</div>

<div class=copyright>구슬 뽑기 —
  <a href=https://github.com/lazygyu/roulette target=_blank rel=noopener>lazygyu의 Marble Roulette</a>(MIT) 기반 교실용 포크
</div>
